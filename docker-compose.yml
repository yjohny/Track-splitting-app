services:
  app:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - data:/app/data
    environment:
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - DB_PATH=/app/data/jobs.db
      - CLEANUP_MAX_AGE_HOURS=24
      - RATE_LIMIT_MAX=10
      - RATE_LIMIT_WINDOW=3600
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  uploads:
  outputs:
  data:
